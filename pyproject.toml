[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-attention-distress-reconstruction"
version = "0.1.0"
description = "Auditable public-data reconstruction of incident corporate financial distress"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scikit-learn==1.8.0", "torch==2.8.0", "transformers==4.55.4", "PyMuPDF==1.26.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
distress = ["schema.sql"]
