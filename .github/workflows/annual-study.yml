name: Annual ST audit freeze and experiments
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/annual-study.yml'
      - 'src/distress/annual_audit.py'
      - 'src/distress/annual_freeze.py'
      - 'src/distress/annual_train.py'
      - 'analysis/audit_annual_inputs.py'
      - 'analysis/freeze_annual_st.py'
permissions:
  contents: write
concurrency:
  group: annual-study-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Audit latest indexed annual reports
        run: |
          python analysis/verify_exchange_register.py
          python analysis/audit_annual_inputs.py
          python analysis/build_annual_st.py
      - name: Freeze only when class and source checks pass
        id: freeze
        run: python analysis/freeze_annual_st.py
      - name: Commit audit and frozen sample before estimation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derived/annual_st data/verification/annual_st data/derived/filing_summary.json README.md file_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record annual source audit and freeze readiness before estimation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Install CPU training dependencies
        if: steps.freeze.outputs.ready == 'true'
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 matplotlib==3.10.8
      - name: Run identical-input comparisons and cluster intervals
        if: steps.freeze.outputs.ready == 'true'
        env:
          PYTHONPATH: src
        run: python -m distress.annual_train --root . --output runs/annual-st-v1
      - name: Commit empirical results
        if: steps.freeze.outputs.ready == 'true'
        run: |
          mkdir -p data/derived/annual_st/results
          cp runs/annual-st-v1/results.json runs/annual-st-v1/predictions.csv runs/annual-st-v1/training_log.json runs/annual-st-v1/test_curves.png data/derived/annual_st/results/
          python analysis/register_annual_results.py
          git add data/derived/annual_st/results data/derived/filing_summary.json file_manifest.json
          git commit -m 'Record annual ST predictions logs and paired statistical results'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve audit and training recovery files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-study-${{ github.run_id }}
          path: |
            data/verification/annual_st/
            data/derived/annual_st/
            runs/annual-st-v1/
          retention-days: 30
