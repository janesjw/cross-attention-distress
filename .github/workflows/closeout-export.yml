name: Check existing databases for closeout
on:
  push:
    paths: ['.github/workflows/closeout-export.yml', 'analysis/sqlite_closeout.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing SQLite snapshots and frozen linkage
        run: python analysis/sqlite_closeout.py
