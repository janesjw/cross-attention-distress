name: Research data pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-pipeline.yml'
      - 'analysis/run_pipeline.py'
      - 'analysis/structure_financials.py'
      - 'analysis/import_reviewed_evidence.py'
      - 'analysis/build_samples.py'
      - 'src/distress/sample_builder.py'
      - 'src/distress/dataset.py'
      - 'data/verification/reviewed/**'
      - 'data/derived/frozen_dataset.json'
      - 'configs/collection_cohort.json'
      - 'configs/active_study.json'
      - 'configs/simplified_cohort.json'
      - 'configs/simplified_protocol.json'
      - 'src/distress/annual_st.py'
      - 'analysis/build_annual_st.py'
      - 'analysis/verify_exchange_register.py'
      - 'data/raw/szse_register_20260910.zip'
permissions:
  contents: read
concurrency:
  group: research-data-pipeline
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ready: ${{ steps.freeze.outputs.ready }}
      source_sha: ${{ steps.persist.outputs.sha }}
      study: ${{ steps.pipeline.outputs.study }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Register reviewed source evidence
        if: hashFiles('data/derived/annual_st/frozen_manifest.json') == ''
        run: python analysis/import_reviewed_evidence.py
      - name: Rebuild fixed-cohort sample decisions
        if: hashFiles('data/derived/annual_st/frozen_manifest.json') == ''
        run: python analysis/build_samples.py
      - name: Verify official ST register and listing intervals
        if: hashFiles('data/derived/annual_st/frozen_manifest.json') == ''
        run: python analysis/verify_exchange_register.py
      - name: Inventory simplified study before extraction
        if: hashFiles('data/derived/annual_st/frozen_manifest.json') == ''
        run: python analysis/build_annual_st.py
      - name: Preserve sample decisions before extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derived data/verification data/verified_text file_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save evidence-driven sample decisions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Extract next batch and check analytical readiness
        id: pipeline
        run: python analysis/run_pipeline.py --limit 1000 --minutes 25 --workers 4
      - name: Structure statements and check accounting identities
        if: always() && hashFiles('data/derived/annual_st/frozen_manifest.json') == ''
        run: python analysis/structure_financials.py
      - name: Audit annual source inputs
        if: always() && hashFiles('data/derived/annual_st/frozen_manifest.json') == ''
        run: python analysis/audit_annual_inputs.py
      - name: Inventory simplified annual ST study
        if: always() && hashFiles('data/derived/annual_st/frozen_manifest.json') == ''
        run: python analysis/build_annual_st.py
      - name: Check annual freeze readiness
        id: freeze
        run: python analysis/freeze_annual_st.py
      - name: Preserve completed work
        id: persist
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data/automation ]; then
            git add data/automation data/verification data/verified_text data/derived README.md file_manifest.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save disclosure extraction progress'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain source PDFs and recovery files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disclosure-batch-${{ github.run_id }}
          path: |
            data/automation_downloads/
            data/automation/
          retention-days: 30
          if-no-files-found: warn
  train:
    needs: extract
    if: needs.extract.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . matplotlib==3.10.8
      - name: Train annual ST comparisons
        if: needs.extract.outputs.study == 'annual_st_v1'
        run: python -m distress.annual_train --root . --output runs/annual-st-v1
      - name: Train only on a registered frozen dataset
        if: needs.extract.outputs.study != 'annual_st_v1'
        run: |
          mkdir -p runs
          cp data/derived/distress.sqlite runs/training.sqlite
          python -m distress.train --database runs/training.sqlite --manifest data/derived/frozen_dataset.json --output runs/main-seed42 --seed 42 --device cpu
      - name: Commit annual empirical results
        if: needs.extract.outputs.study == 'annual_st_v1'
        run: |
          mkdir -p data/derived/annual_st/results
          cp runs/annual-st-v1/results.json runs/annual-st-v1/predictions.csv runs/annual-st-v1/training_log.json runs/annual-st-v1/test_curves.png data/derived/annual_st/results/
          python analysis/register_annual_results.py
          python analysis/summarize_annual_results.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derived/annual_st/results data/derived/filing_summary.json file_manifest.json
          git commit -m 'Record annual ST empirical comparisons'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save predictions, logs, database and model checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-${{ github.run_id }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
