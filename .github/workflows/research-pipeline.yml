name: Research data pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-pipeline.yml'
      - 'analysis/run_pipeline.py'
      - 'analysis/structure_financials.py'
      - 'analysis/import_reviewed_evidence.py'
      - 'analysis/build_samples.py'
      - 'src/distress/sample_builder.py'
      - 'src/distress/dataset.py'
      - 'data/verification/reviewed/**'
      - 'data/derived/frozen_dataset.json'
      - 'configs/collection_cohort.json'
      - 'configs/active_study.json'
      - 'configs/simplified_cohort.json'
      - 'configs/simplified_protocol.json'
      - 'src/distress/annual_st.py'
      - 'analysis/build_annual_st.py'
permissions:
  contents: read
concurrency:
  group: research-data-pipeline
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ready: ${{ steps.pipeline.outputs.ready }}
      source_sha: ${{ steps.persist.outputs.sha }}
      study: ${{ steps.pipeline.outputs.study }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Register reviewed source evidence
        run: python analysis/import_reviewed_evidence.py
      - name: Rebuild fixed-cohort sample decisions
        run: python analysis/build_samples.py
      - name: Preserve sample decisions before extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derived data/verification data/verified_text file_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save evidence-driven sample decisions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Extract next batch and check analytical readiness
        id: pipeline
        run: python analysis/run_pipeline.py --limit 1000 --minutes 25 --workers 4
      - name: Structure statements and check accounting identities
        if: always()
        run: python analysis/structure_financials.py
      - name: Inventory simplified annual ST study
        if: always()
        run: python analysis/build_annual_st.py
      - name: Preserve completed work
        id: persist
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data/automation ]; then
            git add data/automation data/verification data/verified_text data/derived file_manifest.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save disclosure extraction progress'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain source PDFs and recovery files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disclosure-batch-${{ github.run_id }}
          path: |
            data/automation_downloads/
            data/automation/
          retention-days: 30
          if-no-files-found: warn
  train:
    needs: extract
    if: needs.extract.outputs.ready == 'true' && needs.extract.outputs.study != 'annual_st_v1'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - name: Train only on a registered frozen dataset
        run: |
          mkdir -p runs
          cp data/derived/distress.sqlite runs/training.sqlite
          python -m distress.train --database runs/training.sqlite --manifest data/derived/frozen_dataset.json --output runs/main-seed42 --seed 42 --device cpu
      - name: Save predictions, logs, database and model checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-${{ github.run_id }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
