name: Screen selected cohort
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analysis/collect_industry_sources.py'
      - '.github/workflows/screen-cohort.yml'
      - 'analysis/screen_cohort.py'
      - 'analysis/verify_st_covers.py'
permissions:
  contents: write
concurrency:
  group: screen-selected-cohort
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python analysis/collect_industry_sources.py
      - run: python analysis/verify_st_covers.py
      - run: python analysis/screen_cohort.py
      - name: Save source evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/industry data/derived/industry_source_status.json data/derived/st_cover_evidence.json data/derived/cohort_screening.sqlite data/derived/cohort_screening.csv data/derived/cohort_screening_summary.json data/derived/historical_industry.json file_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save historical industry classification sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-sources
          path: |
            data/raw/industry/
            data/derived/industry_source_status.json
          retention-days: 30

