name: Collect public disclosures
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect-data.yml'
permissions:
  contents: read
concurrency:
  group: public-disclosures
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        bucket: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and verify announcement pages
        run: python analysis/collect_disclosures.py --bucket ${{ matrix.bucket }} --buckets 8 --workers 2
      - name: Save source responses and disclosure index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filings-${{ matrix.bucket }}
          path: |
            data/derived/filings.sqlite
            data/derived/filings.json
            data/query_cache/firm_reports/
          retention-days: 30
          if-no-files-found: error
  save:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: filings-*
          path: collected
      - name: Preserve collected sources in the private repository
        run: |
          python analysis/archive_disclosures.py collected data/raw/filing_sources.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/filing_sources.zip file_manifest.json
          git commit -m 'Save collected periodic-disclosure sources'
          git push origin HEAD:main
