name: Collect public disclosures
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect-data.yml'
permissions:
  contents: read
concurrency:
  group: public-disclosures
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and verify announcement pages
        run: python analysis/collect_disclosures.py --years ${{ matrix.year }} --workers 2
      - name: Save source responses and disclosure index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disclosures-${{ matrix.year }}
          path: |
            data/derived/disclosures.sqlite
            data/derived/disclosures.json
            data/query_cache/annual_ranges/
          retention-days: 30
          if-no-files-found: error
